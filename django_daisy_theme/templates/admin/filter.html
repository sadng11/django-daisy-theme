{% load i18n %}
<div class="space-y-2">
  <h4 class="font-semibold text-xs text-base-content/60 uppercase tracking-wider px-1">
    {{ title }}
  </h4>
  <ul class="menu bg-base-200/40 rounded-xl p-1 text-xs gap-0.5">
    {% for choice in choices %}
    <li>
      <a
        href="{{ choice.query_string|iriencode }}"
        class="flex items-center justify-between py-1.5 rounded-lg text-xs {% if choice.selected %}bg-primary/15 text-primary font-semibold{% else %}text-base-content/80 hover:bg-base-200{% endif %}"
      >
        <span class="truncate">{{ choice.display }}</span>
        {% if choice.selected %}
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        {% endif %}
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
