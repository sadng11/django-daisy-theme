[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-daisy-theme"
version = "0.1.0"
description = "A modern, responsive DaisyUI & Tailwind CSS theme for Django Admin with native bi-directional RTL/LTR support"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Django Daisy Theme Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.2",
]

[project.urls]
Homepage = "https://github.com/sadng11/django-daisy-theme"
Documentation = "https://github.com/sadng11/django-daisy-theme#readme"
Issues = "https://github.com/sadng11/django-daisy-theme/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["django_daisy_theme*"]

[tool.setuptools.package-data]
django_daisy_theme = [
    "templates/**/*.html",
    "static/**/*",
]
